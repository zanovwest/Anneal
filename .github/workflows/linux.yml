name: Linux

on:
  push:
    branches: [main, codex/linux-support]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            xvfb xauth lilv-utils
      - name: Test Linux install and packaging scripts
        run: bash tests/LinuxPackagingTests.sh
      - name: Build VST3, LV2, CLAP and Standalone; test and package
        env:
          CMAKE_GENERATOR: Ninja
        run: bash build.sh --test --snapshot --package --jobs 2
      - name: Inspect the LV2 bundle
        env:
          LV2_PATH: ${{ github.workspace }}/build-linux/Anneal_artefacts/Release/LV2
        run: |
          lv2ls | grep -Fx 'urn:qulic:anneal'
          lv2info urn:qulic:anneal
      - name: Verify runtime dependencies
        run: |
          for binary in build-linux/Anneal_artefacts/Release/VST3/Anneal.vst3/Contents/x86_64-linux/Anneal.so \
                        build-linux/Anneal_artefacts/Release/CLAP/Anneal.clap \
                        build-linux/Anneal_artefacts/Release/Standalone/Anneal; do
            ldd "$binary" | tee dependencies.txt
            if grep -q 'not found' dependencies.txt; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Anneal-Linux-x86_64
          path: dist/Anneal-*-Linux-x86_64.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anneal-Linux-snapshots
          path: build-linux/snapshots/*.png
          if-no-files-found: ignore

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Anneal-Linux-x86_64
          path: dist
      - name: Attach tested Linux package to its release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256
